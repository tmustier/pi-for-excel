name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm)
        run: npm audit --audit-level=high

      - name: Lint + typecheck
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate manifest
        run: npm run validate

  browser-contracts:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install recording tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Browser contracts (shard ${{ matrix.shard }} of 4)
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}/4
        run: npm run test:browser
