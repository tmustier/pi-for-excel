<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf9f7; --surface:#fff; --surface-2:#f1efeb; --line:#e6e3de; --line-strong:#d3cfc8; --fg:#1c1b19; --fg-2:#55524d; --fg-3:#6b6862; --accent:#1e6f55; --amber:#9a6b12; --amber-soft:#fbf3e3; --red:#b4421f; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; }
  *{box-sizing:border-box;margin:0;padding:0} svg{display:block;flex:none}
  body{background:#d8d5cf;font:13px var(--sans);color:var(--fg);padding:34px;display:flex;gap:24px;align-items:flex-start;font-variant-numeric:tabular-nums}
  .col{background:var(--bg);border:1px solid #bfbbb3;padding:14px;position:relative;flex:none}
  .cap{position:absolute;top:-22px;left:0;font:500 11px var(--sans);color:#4a4843}
  .user{padding:9px 12px;background:var(--surface-2);border-radius:8px;line-height:1.5;margin-bottom:14px}
  .prose{line-height:1.55;font-size:13.5px} .prose+.grp,.grp+.prose{margin-top:12px}
  .prose code{font:400 12.5px var(--mono);background:var(--surface-2);padding:1px 3px;border-radius:3px}
  .ref{font-family:var(--mono);font-size:12px;white-space:nowrap}

  .grp{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
  .gh{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;min-height:38px}
  .stack{display:flex} .stack span{width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--fg-2);margin-left:-6px} .stack span:first-child{margin-left:0}
  .gh .t{flex:1;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .gh .t.waiting{color:var(--amber)}
  .gh .n{color:var(--fg-3);font-size:12px;white-space:nowrap} .gh .n.fail{color:var(--red);display:inline-flex;align-items:center;gap:4px}
  .gh .chev{color:var(--fg-3)}
  .rows{border-top:1px solid var(--line)}
  .row{border-bottom:1px solid var(--line);font-size:12.5px;padding:8px 10px 8px 12px}
  .row:last-child{border-bottom:0}
  .row.live{background:var(--surface-2)} .row.live .s{color:var(--fg-2)}
  .row.approval{background:var(--amber-soft)}
  .line{display:grid;grid-template-columns:16px minmax(0,1fr) auto 14px;column-gap:8px;align-items:start}
  .line .ic{color:var(--fg-3);height:18px;display:grid;place-items:center} .ic.ok{color:var(--accent)} .ic.err{color:var(--red)} .ic.wait{color:var(--amber)}
  .line .s{line-height:18px;color:var(--fg)} .row.err .s{color:var(--red)}
  .line .meta{color:var(--fg-3);font-size:11.5px;line-height:18px;white-space:nowrap}
  .line .chev{color:var(--fg-3);height:18px;display:grid;place-items:center}
  .sub{margin:3px 0 0 24px;color:var(--fg-2);font-size:12px;line-height:1.45}
  .acts{margin:8px 0 2px 24px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
  .btn{display:inline-flex;align-items:center;gap:5px;height:28px;font:500 12px var(--sans);line-height:1;padding:0 10px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);white-space:nowrap}
  .btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .btn.text{border-color:transparent;background:transparent;color:var(--fg-2);padding:0 6px}
  .link{display:block;margin:6px 0 0 24px;text-align:right;font:400 12px var(--sans);color:var(--fg-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
  .detail{margin:8px -10px -8px -12px;border-top:1px solid var(--line);background:var(--bg)}
  table{border-collapse:collapse;width:100%;font:400 12px var(--mono)}
  th{text-align:left;font:500 11px var(--sans);color:var(--fg-3);padding:6px 12px;border-bottom:1px solid var(--line)}
  td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top} tr:last-child td{border-bottom:0}
  td .f{display:block;color:var(--fg-3);font-size:11px;margin-top:2px} td.new{color:var(--accent)} td.cell{color:var(--fg-2)}
  td.more{font-family:var(--sans);color:var(--fg-2);font-weight:500}
  .foot{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 12px;border-top:1px solid var(--line);font-size:12.5px}
  .foot .t{flex:1;font-weight:500;min-width:0;margin-right:4px} .foot .t span{font-weight:400;color:var(--fg-2)}
  @keyframes spin{to{transform:rotate(360deg)}} .spin{animation:spin 1s linear infinite}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
  <symbol id="pending" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="8"/></symbol>
  <symbol id="chev-d" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="chev-u" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="sheet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></symbol>
  <symbol id="py" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5M12 19h8"/></symbol>
  <symbol id="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
</svg>
<script>
const I=(id,s=14,cls='')=>`<svg class="${cls}" width="${s}" height="${s}"><use href="#${id}"/></svg>`;
const icon={ok:'check',err:'alert',wait:'pending',live:'spinner'};
const row=(o)=>`<div class="row ${o.cls||''}">
  <div class="line">
    <span class="ic ${o.st}">${I(icon[o.st],13,o.st==='live'?'spin':'')}</span>
    <span class="s">${o.s}</span>
    <span class="meta">${o.meta||''}</span>
    <span class="chev">${I(o.open?'chev-u':'chev-d',13)}</span>
  </div>
  ${o.sub?`<div class="sub">${o.sub}</div>`:''}
  ${o.acts?`<div class="acts">${o.acts}</div>`:''}
  ${o.link?`<a class="link">${o.link}</a>`:''}
  ${o.detail?`<div class="detail">${o.detail}</div>`:''}
</div>`;
const ref=s=>`<span class="ref">${s}</span>`;
const stack=(ids)=>`<span class="stack">${ids.map(i=>`<span>${I(i,12)}</span>`).join('')}</span>`;
const grp=(o)=>`<div class="grp">
  <div class="gh">${stack(o.icons)}<span class="t ${o.tcls||''}">${o.title}</span>${o.n?`<span class="n ${o.ncls||''}">${o.n}</span>`:''}<span class="chev">${I(o.open?'chev-u':'chev-d',14)}</span></div>
  ${o.open&&o.rows?`<div class="rows">${o.rows.map(row).join('')}</div>`:''}
  ${o.foot?`<div class="foot"><span class="t">${o.foot}</span><button class="btn text">Undo</button><button class="btn">Review</button></div>`:''}
</div>`;
const user=`<div class="user">Fill the Q3 rows from the Inputs sheet and flag anything that doesn't reconcile.</div>`;
const intro=`<div class="prose">Inputs has monthly values in <code>Inputs!C4:K9</code>. I'll fill rows 10–15 with formulas, then check the totals against Summary.</div>`;
const diff=`<table><tr><th>Cell</th><th>Before</th><th>After</th></tr>
<tr><td class="cell">D10</td><td>125,000<span class="f">=C19+C24</span></td><td class="new">130,000<span class="f">=Inputs!C4</span></td></tr>
<tr><td class="cell">E10</td><td>130,000<span class="f">=D19+D24</span></td><td class="new">135,000<span class="f">=Inputs!D4</span></td></tr>
<tr><td class="more" colspan="3">Show 7 more</td></tr></table>`;

const states={
 A:['Streaming', user+intro+grp({icons:['sheet'],title:'Working',open:true,rows:[
   {st:'ok',s:`Read ${ref('Inputs!C4:K9')}`,meta:'54 cells'},
   {st:'ok',s:`Filled ${ref("'Cash Flow'!D10:L10")}`,meta:'9 cells'},
   {st:'live',cls:'live',s:`Filling ${ref("'Cash Flow'!D11:L11")}`}]})],
 B:['Error inline', user+intro+grp({icons:['sheet'],title:'Working',n:I('alert',12)+'1 failed',ncls:'fail',open:true,rows:[
   {st:'ok',s:`Read ${ref('Inputs!C4:K9')}`,meta:'54 cells'},
   {st:'ok',s:`Filled ${ref("'Cash Flow'!D10:L10")}`,meta:'9 cells'},
   {st:'err',cls:'err',s:`Could not fill ${ref("'Cash Flow'!D12:L12")}`,sub:`<span class="ref">Inputs!C6</span> no longer exists, so the formula returns <span class="ref">#REF!</span>.`},
   {st:'live',cls:'live',s:`Filling ${ref("'Cash Flow'!D12:L12")} from ${ref('Inputs!C7:K7')}`}]})],
 C:['Waiting for approval', user+intro+grp({icons:['sheet','py'],title:'Waiting for approval',tcls:'waiting',open:true,rows:[
   {st:'ok',s:`Filled ${ref("'Cash Flow'!D10:L15")}`,meta:'54 cells'},
   {st:'ok',s:`Ran Python`,meta:'3 s'},
   {st:'wait',cls:'approval',s:`Delete rows 40–52 in ${ref('Summary')}`,sub:`Removes 13 rows and 78 non-empty cells. Covered by a backup for this session.`,acts:`<button class="btn">Decline</button><button class="btn primary">Delete</button>`,link:'Allow for the rest of this turn'}]})],
 D:['Done, collapsed', user+grp({icons:['sheet','py','globe'],title:'Worked for 8s',foot:'Changed 45 cells'})+
   `<div class="prose">Filled rows 10–15. Five rows reconcile to Summary. <strong>Row 12 (Opex)</strong> returned <code>#REF!</code> because <code>Inputs!C6</code> was deleted, so I left it blank. Want me to restore it from the last backup?</div>`],
 E:['Done, expanded, one row drilled in', user+grp({icons:['sheet','py','globe'],title:'Worked for 8s',n:I('alert',12)+'1 failed',ncls:'fail',open:true,rows:[
   {st:'ok',s:`Read ${ref('Inputs!C4:K9')}`,meta:'54 cells'},
   {st:'ok',open:true,s:`Filled ${ref("'Cash Flow'!D10:L10")}`,meta:'9 cells',detail:diff},
   {st:'err',cls:'err',s:`Could not fill ${ref("'Cash Flow'!D12:L12")}`,sub:`<span class="ref">Inputs!C6</span> no longer exists, so the formula returns <span class="ref">#REF!</span>.`},
   {st:'ok',s:`Filled ${ref("'Cash Flow'!D12:L12")} from ${ref('Inputs!C7:K7')}`,meta:'9 cells'},
   {st:'ok',s:`Filled ${ref("'Cash Flow'!D13:L15")}`,meta:'27 cells'},
   {st:'ok',s:`Ran Python`,meta:'3 s'},
   {st:'ok',s:`Searched the web for UK CPI, Q3 2026`,meta:'6 results'}],foot:'Changed 45 cells'})],
};
const params=new URLSearchParams(location.search);
const w=Number(params.get('w')||360), only=params.get('only');
const keys=(only?only.split(','):Object.keys(states)).filter(k=>Object.hasOwn(states,k));
document.body.innerHTML+=keys.map(k=>`<div class="col" style="width:${w}px"><div class="cap">${k}  ${states[k][0]}  ${w}px</div>${states[k][1]}</div>`).join('');
if(params.get('zoom')) document.body.style.zoom=params.get('zoom');
</script>
</body></html>
